<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoeKoe 评论面板</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="panel">
    <div class="hero">
      <div>
        <span class="eyebrow">COMMENT DECK</span>
        <h1>评论面板</h1>
        <p class="desc">为 MoeKoe Music 增加歌单/专辑评论区。</p>
      </div>
      <div class="dot"></div>
    </div>

    <div class="section">
      <div class="switch">
        <input id="enabledCheckbox" type="checkbox">
        <span>启用评论面板</span>
      </div>

      <div class="field">
        <label class="label" for="pageSizeSelect">每页评论数</label>
        <select id="pageSizeSelect">
          <option value="10">10 条</option>
          <option value="20">20 条</option>
          <option value="30">30 条</option>
        </select>
      </div>

      <div class="field">
        <label class="switch">
          <input id="showAlbumCommentsCheckbox" type="checkbox">
          <span>专辑详情页也显示评论</span>
        </label>
      </div>
    </div>
    <div class="actions">
      <button id="saveButton" class="primary">保存配置</button>
      <button id="resetButton" class="secondary">恢复默认</button>
    </div>

    <div id="statusText" class="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
